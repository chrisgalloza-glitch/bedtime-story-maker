services:
  - type: web
    name: bedtime-story-maker
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: FAMILY_PIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MOCK_LLM
        value: "0"
      - key: DATA_DIR
        value: /data
